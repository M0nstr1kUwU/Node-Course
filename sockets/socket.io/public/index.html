<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!--html render element-->
    
    <form class="container">
        <span>CHAT IO</span>
        <input class="form-control" id="inputText" type="text" placeholder="Input text here...">
        <button class="btn btn-primary" id="btnSend" type="submit">Send</button>
    </form>
    
    <!--code namespace-->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const inputText = document.querySelector('#inputText');
        const buttonSend = document.querySelector('#btnSend');

        const socket = io('http://localhost:8000');

        socket.on('connect', () => {

        });

        function sendMessage() {
            let text = inputText.value;
            socket.emit("sendMessage", { data: `${text}` });
        }

        buttonSend.addEventListener('click', sendMessage)


        socket.on("newMessage", (dataFromClients) => {
            console.log(dataFromClients);
        });
    </script>
</body>
