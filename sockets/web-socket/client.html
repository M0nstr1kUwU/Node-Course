<script>
    let ws = new WebSocket('ws://localhost:8000');

    ws.onopen = (event) => {
        alert("Sending to server");
        ws.send("Server Hello!");
        //ws.on('message', () => { console.log(message); })
        ws.onmessage = (event) => {
            alert(`[message] Data received from server: ${event.data}`);
        };
    };

   
</script>
